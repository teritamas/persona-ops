
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペルソナOps | AIユーザーリサーチ & シミュレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel Core -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    /* Warm White & Orange Visual System (Team Teritama Custom Brand Override) */
    :root {
      --bg: #faf8f5;          /* Warm off-white / light cream background */
      --surface: #ffffff;     /* Pure white surface for cards and panels */
      --fg: #2c1d11;          /* Dark warm charcoal / dark brown text */
      --muted: #857264;       /* Muted warm grayish-brown */
      --border: #ebdcd0;      /* Soft warm border color */
      --accent: #ff8904;      /* Brand color orange */
      --accent-hover: #d87100;
      
      /* Helpers for Strict Contrast & Theme State Colors */
      --white: #ffffff;
      --black: #000000;
      --danger: #dc2626;      /* Warm red for angry feedback */
      --success: #16a34a;     /* Warm green for happy feedback */

      --font-display: "Outfit", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-body: "Outfit", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      
      --radius: 8px;

      --shadow-sm: 0 1px 3px rgba(44, 29, 17, 0.05), 0 1px 2px rgba(44, 29, 17, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(44, 29, 17, 0.08), 0 2px 4px -1px rgba(44, 29, 17, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(44, 29, 17, 0.1), 0 4px 6px -2px rgba(44, 29, 17, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      height: 100vh;
      overflow: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Accessibility Focus styles */
    button:focus-visible, 
    input:focus-visible, 
    textarea:focus-visible, 
    [role="button"]:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Layout structure */
    .app-container {
      display: grid;
      grid-template-rows: 64px 1fr;
      height: 100vh;
      width: 100vw;
      background-color: var(--bg);
    }

    /* Header styling */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 20px;
      color: var(--fg);
    }

    .brand-logo {
      background: var(--accent);
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-weight: 700;
      font-size: 18px;
    }

    /* Project Dropdown styles */
    .project-dropdown-container {
      position: relative;
    }

    .project-selector-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .project-selector-btn:hover {
      border-color: var(--accent);
      background: var(--surface);
    }
    .project-selector-btn svg {
      transition: transform 0.2s ease;
    }
    .project-selector-btn.open svg {
      transform: rotate(180deg);
    }

    .project-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 20;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .project-option {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--fg);
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background 0.15s ease;
    }
    .project-option:hover {
      background: var(--bg);
    }
    .project-option.active {
      background: color-mix(in srgb, var(--accent) 8%, var(--bg));
      border-left: 3px solid var(--accent);
      padding-left: 9px;
    }
    .project-opt-name {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .project-opt-desc {
      font-size: 11px;
      color: var(--muted);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .btn-create-project-opt {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-create-project-opt:hover {
      background: color-mix(in srgb, var(--accent) 6%, var(--bg));
      border-color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .meta-badge {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Primary layout body */
    .app-body {
      display: flex;
      height: 100%;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Phase 1: Crafting Canvas */
    .phase-crafting-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 24px;
      overflow-y: auto;
      background: var(--bg);
    }

    .crafting-welcome-area {
      max-width: 600px;
      text-align: center;
      margin-top: 40px;
      margin-bottom: 24px;
    }

    .crafting-title {
      font-size: 28px;
      color: var(--fg);
      margin-bottom: 8px;
    }

    .crafting-subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .crafting-chat-container {
      width: 100%;
      max-width: 720px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 0;
      overflow-y: auto;
    }

    .chat-bubble-row {
      display: flex;
      width: 100%;
    }
    .chat-bubble-row.user {
      justify-content: flex-end;
    }
    .chat-bubble-row.ai {
      justify-content: flex-start;
    }

    .chat-bubble {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      box-shadow: var(--shadow-sm);
      animation: messageSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes messageSlideIn {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .chat-bubble-row.user .chat-bubble {
      background: var(--accent);
      color: var(--white);
      border-bottom-right-radius: 2px;
    }
    .chat-bubble-row.ai .chat-bubble {
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    /* Action Card for generation */
    .chat-action-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 80%;
      align-self: flex-start;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .chat-action-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    .chat-action-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .btn-action-generate {
      background: var(--accent);
      color: var(--white);
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
      align-self: flex-start;
    }
    .btn-action-generate:hover {
      background-color: var(--accent-hover);
    }

    /* Inputs at bottom of crafting */
    .crafting-bottom-panel {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-md);
      margin-top: 16px;
    }

    .progress-tracker {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-bar-track {
      height: 4px;
      background: var(--bg);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .crafting-integrations-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .integration-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .integration-pill:hover {
      border-color: var(--accent);
    }
    .integration-pill.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    }

    .integration-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
    }
    .integration-pill.active .integration-status-dot {
      background: var(--accent);
    }

    .chat-input-form {
      display: flex;
      gap: 8px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      border-radius: var(--radius);
    }
    .chat-input-form.dragging {
      background-color: color-mix(in srgb, var(--accent) 6%, var(--bg));
    }

    .chat-text-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      color: var(--fg);
    }
    .chat-text-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .chat-text-input::placeholder {
      color: var(--muted);
    }

    .btn-send-message {
      background: var(--accent);
      color: var(--white);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background-color 0.2s ease;
    }
    .btn-send-message:hover {
      background-color: var(--accent-hover);
    }

    /* Transition loader view */
    .generating-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      height: 100%;
    }

    .generating-loader-box {
      text-align: center;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .generating-circle {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .generating-title {
      font-size: 18px;
      color: var(--fg);
    }

    .generating-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Slim Left Icon Nav (NotebookLM layout style) */
    .dashboard-nav-strip {
      width: 60px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 16px;
      z-index: 5;
    }

    .nav-strip-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s ease;
      position: relative;
    }
    .nav-strip-btn:hover {
      background: var(--bg);
      color: var(--fg);
    }
    .nav-strip-btn.active {
      background: color-mix(in srgb, var(--accent) 8%, var(--bg));
      color: var(--accent);
    }

    .nav-tooltip {
      position: absolute;
      left: 70px;
      background: var(--fg);
      color: var(--bg);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 100;
    }
    .nav-strip-btn:hover .nav-tooltip {
      opacity: 1;
    }

    /* Phase 2: Dashboard container (2 or 3 columns) */
    .phase-dashboard-container {
      flex: 1;
      display: flex;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }

    /* Slide-out knowledge sidebar (Drawer style like NotebookLM) */
    .drawer-panel {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 40;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-lg);
    }
    .drawer-panel.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-close-drawer {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-close-drawer:hover {
      color: var(--fg);
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .project-card-mini {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .project-mini-name {
      font-weight: 700;
      font-size: 12px;
      color: var(--fg);
      margin-bottom: 4px;
    }
    .project-mini-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .resource-list-dashboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resource-card-dashboard {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    .resource-card-status {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .resource-card-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .resource-card-meta {
      font-size: 10px;
      color: var(--muted);
    }

    .add-resource-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .input-textarea-mini {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      color: var(--fg);
      font-size: 11px;
      resize: none;
    }
    .input-textarea-mini::placeholder {
      color: var(--muted);
    }

    /* File dropzone & attachment preview styles */
    .file-dropzone {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .file-dropzone:hover, .file-dropzone.dragging {
      border-color: var(--accent);
      background-color: color-mix(in srgb, var(--accent) 6%, var(--bg));
    }
    .file-dropzone span {
      font-size: 10px;
      color: var(--muted);
    }
    .file-dropzone span:first-of-type {
      font-size: 16px;
    }
    
    .file-attachment-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      animation: fadeIn 0.2s ease;
    }
    .file-attachment-preview .file-icon {
      font-size: 18px;
    }
    .file-attachment-preview .file-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .file-attachment-preview .file-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .file-attachment-preview .file-size {
      font-size: 9px;
      color: var(--muted);
    }
    .file-attachment-preview .btn-remove-file {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .file-attachment-preview .btn-remove-file:hover {
      color: var(--fg);
    }

    .btn-submit-mini {
      background: var(--accent);
      color: var(--white);
      border: none;
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-submit-mini:hover {
      background-color: var(--accent-hover);
    }

    /* Main Dashboard Layout content (switches 2/3 cols) */
    .dashboard-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      height: 100%;
      overflow: hidden;
      transition: grid-template-columns 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dashboard-layout.detail-open {
      grid-template-columns: 1fr 380px;

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      color: var(--fg);

    .simulator-input-field:focus {

      border-color: var(--accent);

    .btn-simulator-submit {

      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;

      border: 1px solid var(--border);

      font-weight: 700;

      background: color-mix(in srgb, var(--danger) 12%, var(--surface));
      border-color: var(--danger);
      color: var(--danger);

    .persona-card-feedback-text {
      font-size: 12px;
      line-height: 1.5;
      color: var(--fg);

    .card-footer-tip {

      color: var(--muted);
      margin-top: auto;
      text-align: right;

      background: var(--surface);

      font-weight: 600;

    .inspector-tab-btn:hover {

      gap: 4px;

      font-size: 13px;

      to { transform: translateY(0); opacity: 1; }

              };
            }
            return p;
          }));
        }, 1000);
      };

      const handleGeneratePersonas = () => {
        // Step 1: Set phase to generating
        setProjects(prev => prev.map(p => {
          if (p.id === currentProjectId) {
            return { ...p, phase: 'generating' };
          }
          return p;
        }));

        // Step 2: Transition to dashboard after simulation delay
        setTimeout(() => {
          setProjects(prev => prev.map(p => {
            if (p.id === currentProjectId) {
              return { ...p, phase: 'dashboard', selectedPersonaId: null };
            }
            return p;
          }));
          showToast("ペルソナ群が生成され、リサーチダッシュボードが解放されました。");
        }, 1500);
      };

      const handleAddResearchNote = (e) => {
        e.preventDefault();
        if (!uploadText.trim() && !attachedFile) return;

        let resName = '';
        let resIcon = 'BookOpen';
        let resMeta = '追加されたリサーチメモ';

        if (attachedFile) {
          resName = attachedFile.name;
          resMeta = uploadText.trim() 
            ? `${uploadText.trim()} (${attachedFile.size})` 
            : `追加資料 (${attachedFile.size})`;
          const ext = attachedFile.name.split('.').pop().toLowerCase();
          if (['pdf'].includes(ext)) {
            resIcon = 'FileText';
          } else if (['csv', 'xls', 'xlsx'].includes(ext)) {
            resIcon = 'LineChart';
          } else if (['doc', 'docx', 'txt'].includes(ext)) {
            resIcon = 'BookOpen';
          } else {
            resIcon = 'Paperclip';
          }
        } else {
          resName = uploadText.length > 18 ? `${uploadText.substring(0, 16)}...` : uploadText;
          resMeta = 'インタビュー記録・追加メモ';
        }

        const newRes = {
          id: `res_note_${Date.now()}`,
          name: resName,
          meta: resMeta,
          active: true,
          icon: resIcon
        };

        setProjects(prev => prev.map(p => {
          if (p.id === currentProjectId) {
            const updatedRes = [...p.resources, newRes];
            const updatedPersonas = p.personas.map(persona => ({
              ...persona,
              activitySteps: getUpdatedActivitySteps(persona.id, p.id),
              bio: `${persona.bio}\n\n[アップデート情報] 追加共有された資料「${resName}」を統合し、行動モデルが最適化されました。`
            }));
            return {
              ...p,
              resources: updatedRes,
              personas: updatedPersonas,
              activityDiagramUpdated: true
            };
          }
          return p;
        }));

        setUploadText('');
        setAttachedFile(null);
        showToast(`資料「${resName}」を分析統合し、ペルソナ行動モデルを改善しました！`);
      };

      const handleRunSimulation = () => {
        const prop = currentProject.featureProposal;
        if (!prop.trim()) return;

        setIsSimulating(true);
        setSimProgressText('接続データから機能設計要件を分析中...');

        setTimeout(() => {
          setSimProgressText('仮想ペルソナの認知モデルによるシミュレーションを実行中...');
        }, 800);

        setTimeout(() => {
          const isStandard = prop.includes('スケジュール');
          const responseDb = isStandard ? SIMULATION_RESPONSES['スケジュール調整機能'] : SIMULATION_RESPONSES['custom'];

          setProjects(prev => prev.map(p => {
            if (p.id === currentProjectId) {
              const updatedPersonas = p.personas.map(persona => {
                const match = responseDb[persona.id] || responseDb[1];
                return {
                  ...persona,
                  sentiment: match.sentiment,
                  feedback: match.feedback,
                  detailedFeedback: match.detailed
                };
              });

              const initialSummonChats = {};
              updatedPersonas.forEach(persona => {
                const match = responseDb[persona.id] || responseDb[1];
                initialSummonChats[persona.id] = match.dialogue || [
                  { sender: 'persona', text: `機能「${prop}」に関して、ユーザーとしての本音をお話しできます。気になる点をお尋ねください。` }
                ];
              });

              return {
                ...p,
                personas: updatedPersonas,
                simulatedFeatureName: prop,
                summonChats: initialSummonChats
              };
            }
            return p;
          }));

          setIsSimulating(false);
          showToast(`機能「${prop}」のシミュレーションが完了しました。`);
        }, 1800);
      };

      const handleSendSummonMsg = (e, textOverride = null) => {
        if (e) e.preventDefault();
        const msgText = textOverride || summonInput;
        if (!msgText.trim()) return;

        const userMsg = { sender: 'user', text: msgText };
        const activeChats = currentProject.summonChats[activePersona.id] || [];

        setProjects(prev => prev.map(p => {
          if (p.id === currentProjectId) {
            const currentChats = p.summonChats[activePersona.id] || [];
            return {
              ...p,
              summonChats: {
                ...p.summonChats,
                [activePersona.id]: [...currentChats, userMsg]
              }
            };
          }
          return p;
        }));

        if (!textOverride) setSummonInput('');

        // Simulate persona response
        setTimeout(() => {
          let responseText = '';
          const lText = msgText.toLowerCase();

          if (currentProject.simulatedFeatureName) {
            if (lText.includes('懸念') || lText.includes('困る') || lText.includes('不満')) {
              if (activePersona.id === 1) responseText = '調整案候補が勝手にシステム上で確定してしまうと、現場に確認する時間もなくなり信頼関係が崩れてしまう点です。サ責が一度ドラフト状態として承認するワンステップが必要です。';
              else if (activePersona.id === 2) responseText = 'スマホの通知に気づかなかった時に、自動で割り振られて遅刻扱いになったり、利用者様をお待たせしたりしないかが心配です。';
              else responseText = '自動化は歓迎ですが、緊急対応時のマニュアル優先度や、特定のヘルパーさんの得意・不得意といった定性要因が無視されないかが気になります。';
            } else if (lText.includes('改善') || lText.includes('どう作') || lText.includes('対策')) {
              if (activePersona.id === 1) responseText = '初期画面に「提案されたスケジュール案（未確定）」をカード一覧で表示し、ボタンをタップした日程のみを同期・通知するフローであればスムーズに馴染みます。';
              else if (activePersona.id === 2) responseText = '音声読み上げ機能や、アセスメント項目の選択式ボタンなど、私のような世代でも素早く操作ミスをなくせる配慮があると助かりますね。';
              else responseText = 'API連携などで予定調整が1クリックで完了するスマートさに加えて、過去の移動速度データから現実的な休憩時間が担保される制御があると心強いです。';
            } else {
              responseText = `ご質問ありがとうございます。この${currentProject.simulatedFeatureName}についてですが、実際の業務フローでは操作時間が少なくて済むような工夫を期待しています。`;
            }
          } else {
            responseText = '現在検討されている新機能の構想をシミュレーターに入力して実行していただければ、より詳細な評価をお答えできますよ。';
          }

          setProjects(prev => prev.map(p => {
            if (p.id === currentProjectId) {
              const currentChats = p.summonChats[activePersona.id] || [];
              return {
                ...p,
                summonChats: {
                  ...p.summonChats,
                  [activePersona.id]: [...currentChats, { sender: 'persona', text: responseText }]
                }
              };
            }
            return p;
          }));
        }, 1000);
      };

      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!newProjName.trim()) return;

        const newId = `proj_${Date.now()}`;
        const newProj = {
          id: newId,
          name: newProjName,
          description: newProjDesc || '新しく追加されたリサーチプロジェクトです。',
          phase: 'crafting',
          generationProgress: 30,
          resources: [
            { id: 'github_src', name: 'github.com/source-repo', icon: 'GitBranch', active: true, meta: '接続済 (main)' },
            { id: 'assessment_doc', name: '製品仕様ドキュメント.txt', icon: 'FileText', active: false, meta: '未接続' }
          ],
          trainingMessages: [
            { sender: 'ai', text: `プロジェクト「${newProjName}」を新規立ち上げました。データソースの接続や、ターゲットユーザー層について会話しながら、カスタムペルソナモデルの構築を進めましょう。` }
          ],
          personas: [
            {
              id: 1,
              name: '田中 浩二 (48)',
              avatar: '👨‍💼',
              role: '現場リーダー (業務歴8年)',
              bio: '業務プロセスの調整役。ITの必要性は感じるが、従来のやり方に固執する現場スタッフと経営層の板挟みに悩んでいる。',
              stats: { literacy: 60, workload: 80, adaptability: 70 },
              sentiment: 'troubled',
              feedback: '「シミュレーションはまだ実行されていません。」',
              detailedFeedback: '新機能を提案しシミュレーションを実行すると、現場代表としてのリアクションを表示します。',
              activitySteps: [
                { label: '朝礼・指示出し', desc: '今日のシフトと業務目標を手動の予定表で共有。', status: 'normal' },
                { label: '案件変更調整', desc: '急な割り込み案件が発生し、対応できる現場人員を探して各所に電話確認。', status: 'alert' },
                { label: '報告書承認', desc: '現場から上がってきた紙の報告書をもとにPCへ手動登録。', status: 'alert' }
              ],
              summonChats: []
            },
            {
              id: 2,
              name: '小林 美香 (27)',
              avatar: '👩',
              role: '若手オペレーター (業務歴2年)',
              bio: '効率化を最重視する世代。アプリのレスポンスが悪いことや、古い慣習の残る二重入力業務に強い不満を持つ。',
              stats: { literacy: 90, workload: 75, adaptability: 95 },
              sentiment: 'troubled',
              feedback: '「シミュレーションはまだ実行されていません。」',
              detailedFeedback: 'シミュレーションを実行して、新機能が業務プロセスに与える影響をテストしてください。',
              activitySteps: [
                { label: '予定確認', desc: 'PCで今日のスケジュールと対象案件情報をキャッチ。', status: 'normal' },
                { label: '現場対応・登録', desc: '対応をしながらタブレットで素早く完了フラグを送信。', status: 'normal' },
                { label: '業務外対応', desc: '調整ミスによる二重移動が発生し、現場で無駄な待ち時間が発生。', status: 'alert' }
              ],
              summonChats: []
            }
          ],
          featureProposal: '',
          simulatedFeatureName: '',
          summonChats: {},
          activityDiagramUpdated: false
        };

        setProjects([...projects, newProj]);
        setCurrentProjectId(newId);
        setModalOpen(false);
        setDropdownOpen(false);
        setNewProjName('');
        setNewProjDesc('');
        showToast(`新規プロジェクト「${newProjName}」を作成しました。`);
      };

      const getUpdatedActivitySteps = (personaId, projectId) => {
        if (projectId === 'fuchsia' || projectId === 'care-navi') {
          if (personaId === 1) {
            return [
              { label: 'アセスメント実施', desc: '利用者の自宅を訪問し、タブレットで基本項目を入力。', status: 'normal' },
              { label: 'スケジュール自動提案', desc: 'AIが最適なヘルパーとの日程・移動ルート案をワンクリックで算出。', status: 'resolved' },
              { label: 'リアルタイム二重登録解除', desc: '事務所に戻らずにタブレットから直接アセスメントと同期し連携完了。', status: 'resolved' }
            ];
          } else if (personaId === 2) {
            return [
              { label: 'アセスメント実施', desc: '手書きメモと音声入力でアセスメントを行い、対話に専念。', status: 'normal' },
              { label: '自動確認通知', desc: '変更通知をスマホでワンタップするだけのシンプル承認に対応。', status: 'resolved' },
              { label: 'アシスタント入力代行', desc: 'メモ写真をアップするだけでOCR自動アセスメント入力が完了。', status: 'resolved' }
            ];
          }
        } else {
          // 新規プロジェクト（汎用）の更新ステップ
          if (personaId === 1) {
            return [
              { label: '朝礼・指示出し', desc: '今日のシフトと業務目標を手動の予定表で共有。', status: 'normal' },
              { label: '案件変更自動調整', desc: 'AIが急な割り込み案件の最適アサインを自動検出・提案。', status: 'resolved' },
              { label: '自動報告書承認', desc: '現場からスマホで報告されたデータを自動登録・自動承認。', status: 'resolved' }
            ];
          } else if (personaId === 2) {
            return [
              { label: '予定確認', desc: 'モバイルアプリで今日のスケジュールと対象案件情報をキャッチ。', status: 'normal' },
              { label: '現場対応・自動登録', desc: '対応が完了するとGPSと音声メモで報告書が自動下書き保存。', status: 'resolved' },
              { label: '業務外対応の自動化', desc: 'AIルート案内により二重移動や待ち時間がゼロに。', status: 'resolved' }
            ];
          }
        }
        return [
          { label: 'アセスメント実施', desc: 'タブレットでメモを取りながらスピーディにアセスメント完了。', status: 'normal' },
          { label: 'スケジュール調整', desc: '自動カレンダーマッチングにより日程調整が自動確定。', status: 'resolved' },
          { label: '基幹システム入力', desc: '自動同期により報告書作成が不要に。', status: 'resolved' }
        ];
      };

      const selectPersona = (id) => {
        setProjects(prev => prev.map(p => {
          if (p.id === currentProjectId) {
            return { ...p, selectedPersonaId: id };
          }
          return p;
        }));
      };

      const closeInspector = () => {
        setProjects(prev => prev.map(p => {
          if (p.id === currentProjectId) {
            return { ...p, selectedPersonaId: null };
          }
          return p;
        }));
      };

      return (
        <div className="app-container" data-od-id="main-app-container">
          
          {/* ==========================================================================
             APP HEADER
             ========================================================================== */}
          <header className="app-header" data-od-id="app-header">
            <div className="brand">
              <div className="brand-logo">P</div>
              <span>ペルソナOps</span>
            </div>

            {/* Project switcher dropdown */}
            <div className="project-dropdown-container">
              <button 
                className={`project-selector-btn ${dropdownOpen ? 'open' : ''}`}
                onClick={() => setDropdownOpen(!dropdownOpen)}
                data-od-id="btn-project-dropdown"
              >
                <Icons.Folder />
                <span>プロジェクト: {currentProject.name}</span>
                <Icons.ChevronDown />
              </button>

              {dropdownOpen && (
                <div className="project-dropdown" data-od-id="dropdown-menu">
                  {projects.map(proj => (
                    <button 
                      key={proj.id}
                      className={`project-option ${proj.id === currentProjectId ? 'active' : ''}`}
                      onClick={() => {
                        setCurrentProjectId(proj.id);
                        setDropdownOpen(false);
                      }}
                      data-od-id={`select-project-${proj.id}`}
                    >
                      <div className="project-opt-name">
                        <span>📁</span>
                        <span>{proj.name}</span>
                      </div>
                      <div className="project-opt-desc">{proj.description}</div>
                    </button>
                  ))}
                  
                  <div className="dropdown-divider"></div>
                  
                  <button 
                    className="btn-create-project-opt"
                    onClick={() => setModalOpen(true)}
                    data-od-id="btn-trigger-create-modal"
                  >
                    <Icons.Plus />
                    <span>新しいプロジェクトを作成</span>
                  </button>
                </div>
              )}
            </div>

            <div className="header-actions">
              <div className="meta-badge">
                <Icons.Database />
                <span>仮想モデル: {currentProject.personas.length}名</span>
              </div>
            </div>
          </header>

          {/* ==========================================================================
             PROJECT CREATION MODAL
             ========================================================================== */}
          {modalOpen && (
            <div className="modal-overlay" onClick={() => setModalOpen(false)}>
              <div className="modal-card" onClick={(e) => e.stopPropagation()} data-od-id="project-create-modal">
                <div className="modal-header">
                  <div className="modal-title">
                    <Icons.Plus />
                    <span>新しいリサーチプロジェクトを作成</span>
                  </div>
                  <button className="btn-close-drawer" onClick={() => setModalOpen(false)}><Icons.Close /></button>
                </div>
                
                <form onSubmit={handleCreateProject}>
                  <div className="modal-body">
                    <div className="form-group-modal">
                      <label htmlFor="modal-p-name">プロジェクト名</label>
                      <input 
                        type="text" 
                        id="modal-p-name"
                        placeholder="例: 訪問介護Navi"
                        value={newProjName}
                        onChange={(e) => setNewProjName(e.target.value)}
                        required
                      />
                    </div>
                    <div className="form-group-modal">
                      <label htmlFor="modal-p-desc">プロジェクトの説明</label>
                      <textarea 
                        id="modal-p-desc"
                        rows="3"
                        placeholder="どのようなプロダクトか、想定されるユーザーについて記述します..."
                        value={newProjDesc}
                        onChange={(e) => setNewProjDesc(e.target.value)}
                      />
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="btn-modal-cancel" onClick={() => setModalOpen(false)}>キャンセル</button>
                    <button type="submit" className="btn-modal-submit">プロジェクトを作成</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================================================
             MAIN CONTAINER BODY
             ========================================================================== */}
          <div className="app-body">

            {/* Slim Left Navigation icon strip */}
            <nav className="dashboard-nav-strip" data-od-id="dashboard-nav-strip">
              <button 
                className={`nav-strip-btn ${currentProject.phase === 'crafting' ? 'active' : ''}`}
                onClick={() => {
                  setProjects(prev => prev.map(p => {
                    if (p.id === currentProjectId) {
                      return { ...p, phase: 'crafting' };
                    }
                    return p;
                  }));
                }}
                disabled={currentProject.phase === 'generating'}
                data-od-id="nav-to-crafting"
              >
                💬
                <span className="nav-tooltip">ペルソナ構築対話</span>
              </button>

              <button 
                className={`nav-strip-btn ${currentProject.phase === 'dashboard' ? 'active' : ''}`}
                onClick={() => {
                  if (currentProject.generationProgress >= 50) {
                    setProjects(prev => prev.map(p => {
                      if (p.id === currentProjectId) {
                        return { ...p, phase: 'dashboard' };
                      }
                      return p;
                    }));
                  }
                }}
                disabled={currentProject.generationProgress < 50 || currentProject.phase === 'generating'}
                data-od-id="nav-to-dashboard"
              >
                📊
                <span className="nav-tooltip">シミュレーション盤</span>
              </button>

              <button 
                className={`nav-strip-btn ${drawerOpen ? 'active' : ''}`}
                onClick={() => setDrawerOpen(!drawerOpen)}
                disabled={currentProject.phase !== 'dashboard'}
                data-od-id="nav-toggle-drawer"
              >
                📁
                <span className="nav-tooltip">ナレッジ・資料管理</span>
              </button>
            </nav>

            {/* ==========================================================================
               PHASE 1: Conversational Persona Builder
               ========================================================================== */}
            {currentProject.phase === 'crafting' && (
              <div className="phase-crafting-container" data-od-id="phase-crafting-view">
                
                {currentProject.trainingMessages.length === 1 && (
                  <div className="crafting-welcome-area">
                    <h1 className="crafting-title">ペルソナを構築する</h1>
                    <p className="crafting-subtitle">
                      GitHubソース、製品仕様書、インタビュー結果などのリソースを接続し、チャットで要件を対話しながらペルソナの認知モデルを設計します。
                    </p>
                  </div>

                <div className="crafting-chat-container">
                  {currentProject.trainingMessages.map((msg, idx) => (
                    <div key={idx} className={`chat-bubble-row ${msg.sender === 'user' ? 'user' : 'ai'}`}>

                      </div>
                    </div>

                      </div>

                  <div className="crafting-integrations-bar">

                          data-od-id={`integration-pill-${res.id}`}

                          <div className="integration-status-dot"></div>
                          <span><ResourceIcon /> {res.name}</span>

                  </div>

                    <div className="file-attachment-preview" style={{ marginBottom: '8px' }}>
                      <span className="file-icon">
                        {(() => {
                          const ext = craftingAttachedFile.name.split('.').pop().toLowerCase();
                          if (ext === 'pdf') return <Icons.FileText />;
                          if (['csv', 'xls', 'xlsx'].includes(ext)) return <Icons.LineChart />;
                          return <Icons.BookOpen />;
                        })()}
                      </span>
                      <div className="file-info">
                        <div className="file-name">{craftingAttachedFile.name}</div>
                        <div className="file-size">{craftingAttachedFile.size}</div>
                      </div>
                      <button type="button" className="btn-remove-file" onClick={() => setCraftingAttachedFile(null)} aria-label="添付ファイルを削除"><Icons.Close /></button>
                    </div>
                  )}

                  <form 
                    onSubmit={handleSendTrainingMsg} 
                    className={`chat-input-form ${isCraftingDragging ? 'dragging' : ''}`}
                    onDragOver={(e) => { e.preventDefault(); setIsCraftingDragging(true); }}
                    onDragLeave={(e) => { e.preventDefault(); setIsCraftingDragging(false); }}
                    onDrop={(e) => {
                      e.preventDefault();
                      setIsCraftingDragging(false);
                      const file = e.dataTransfer.files[0];
                      if (file) {
                        const sizeStr = file.size > 1024 * 1024 
                          ? `${(file.size / (1024 * 1024)).toFixed(1)} MB` 
                          : `${(file.size / 1024).toFixed(0)} KB`;
                        setCraftingAttachedFile({
                          name: file.name,
                          size: sizeStr,
                          type: file.type
                        });
                      }
                    }}
                  >
                    <label 
                      htmlFor="crafting-file-input" 
                      className="btn-attach-chat" 
                      aria-label="ファイルを添付"
                      style={{
                        background: 'var(--surface)',
                        border: '1px solid var(--border)',
                        color: 'var(--muted)',
                        width: '38px',
                        height: '38px',
                        borderRadius: 'var(--radius)',
                        cursor: 'pointer',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        transition: 'all 0.2s ease',
                      }}
                    >
                      <Icons.Paperclip />
                    </label>
                    <input 
                      type="file" 
                      id="crafting-file-input" 
                      style={{ display: 'none' }} 
                      onChange={handleCraftingFileChange}
                      accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt"
                      disabled={currentProject.generationProgress >= 100}
                    />

                    <input 
                      type="text" 
                      className="chat-text-input"
                      placeholder="ユーザー像や業務の課題、リサーチ結果を入力またはファイルを添付してモデルに教える..."
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      disabled={currentProject.generationProgress >= 100}
                    />
                    <button type="submit" className="btn-send-message" disabled={currentProject.generationProgress >= 100}>
                      ➔
                    </button>
                  </form>
                </div>

              </div>
            )}

            {/* ==========================================================================
               TRANSITION SCREEN: Persona Generation
               ========================================================================== */}
            {currentProject.phase === 'generating' && (
              <div className="generating-view" data-od-id="generating-transition-view">
                <div className="generating-loader-box">
                  <div className="generating-circle"></div>
                  <h3 className="generating-title">仮想ペルソナ群をマッピング中</h3>
                  <p className="generating-desc">
                    ソースコード・インタビュー資料のコンテキスト analysis を完了し、仮想の行動プロセスをダッシュボードへデプロイしています...
                  </p>
                </div>
              </div>
            )}

            {/* ==========================================================================
               PHASE 2: 3-Column Simulation Dashboard
               ========================================================================== */}
            {currentProject.phase === 'dashboard' && (
              <div className="phase-dashboard-container" data-od-id="phase-dashboard-view">
                
                {/* Left Drawer panel: Integrated Resources (Slide-in) */}
                <aside className={`drawer-panel ${drawerOpen ? 'open' : ''}`} data-od-id="dashboard-drawer-panel">
                  <div className="drawer-header">
                    <div className="drawer-title">
                      <span>📁 リソース＆ナレッジ</span>
                    </div>
                    <button className="btn-close-drawer" onClick={() => setDrawerOpen(false)}><Icons.Close /></button>
                  </div>
                  
                  <div className="drawer-content">
                    <div className="project-card-mini">
                      <div className="project-mini-name">{currentProject.name}</div>
                      <div className="project-mini-desc">{currentProject.description}</div>
                    </div>

                    <div className="sidebar-section-title">
                      <span>接続資料リソース</span>
                    </div>
                    
                    <div className="resource-list-dashboard">
                      {currentProject.resources.map(res => {
                        const ResourceIcon = Icons[res.icon] || Icons.FileText;
                        return (
                          <div key={res.id} className="resource-card-dashboard">
                            {res.active && <div className="resource-card-status"></div>}
                            <div className="resource-card-header">
                              <span><ResourceIcon /></span>
                              <span>{res.name}</span>
                            </div>
                            <div className="resource-card-meta">{res.meta}</div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Knowledge/Research update upload block */}
                    <form 
                      onSubmit={handleAddResearchNote} 
                      className="add-resource-form" 
                      onDragOver={handleDragOver} 
                      onDragLeave={handleDragLeave} 
                      onDrop={handleDrop}
                    >
                      <span className="sidebar-section-title">新しいリサーチ・インタビューを共有</span>
                      <textarea 
                        className="input-textarea-mini" 
                        rows="3"
                        placeholder="例: 佐藤さんは訪問から戻った後のパソコン入力に苦戦しており、手動調整に日々数時間の超過勤務が発生している..."
                        value={uploadText}
                        onChange={(e) => setUploadText(e.target.value)}
                        required={!attachedFile}
                      />

                      {attachedFile ? (
                        <div className="file-attachment-preview">
                          <span className="file-icon">
                            {(() => {
                              const ext = attachedFile.name.split('.').pop().toLowerCase();
                              if (ext === 'pdf') return <Icons.FileText />;
                              if (['csv', 'xls', 'xlsx'].includes(ext)) return <Icons.LineChart />;
                              return <Icons.BookOpen />;
                            })()}
                          </span>
                          <div className="file-info">
                            <div className="file-name">{attachedFile.name}</div>
                            <div className="file-size">{attachedFile.size}</div>
                          </div>
                          <button type="button" className="btn-remove-file" onClick={() => setAttachedFile(null)} aria-label="添付ファイルを削除"><Icons.Close /></button>
                        </div>
                      ) : (
                        <>
                          <label 
                            className={`file-dropzone ${isDragging ? 'dragging' : ''}`} 
                            htmlFor="research-file-input"
                          >
                            <span><Icons.Paperclip /></span>
                            <span>ファイルを添付、またはドラッグ＆ドロップ</span>
                          </label>
                          <input 
                            type="file" 
                            id="research-file-input" 
                            style={{ display: 'none' }} 
                            onChange={handleFileChange}
                            accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt"
                          />
                        </>
                      )}

                      <button 
                        type="submit" 
                        className="btn-submit-mini" 
                        data-od-id="btn-submit-research"
                        disabled={!uploadText.trim() && !attachedFile}
                      >
                        リサーチデータを統合
                      </button>
                    </form>
                  </div>
                </aside>

                {/* Grid container representing the center and right area */}
                <div className={`dashboard-layout ${activePersona ? 'detail-open' : ''}`}>
                  
                  {/* Center Panel: Simulation Hub & Cards */}
                  <main className="dashboard-center-pane" data-od-id="dashboard-center-pane">
                    
                    {isSimulating && (
                      <div className="simulation-processing-overlay">
                        <div className="generating-circle"></div>
                        <div className="simulation-processing-text">{simProgressText}</div>
                      </div>
                    )}

                    {/* Feature Simulator */}
                    <section className="simulator-card-new" data-od-id="simulator-box">
                      <div className="simulator-card-title">
                        <div className="simulator-card-title-dot"></div>
                        <span>機能追加シミュレーター</span>
                      </div>

                      <div className="simulator-input-row">
                        <input 
                          type="text" 
                          className="simulator-input-field"
                          placeholder="例: スケジュール調整自動提案機能を追加"
                          value={currentProject.featureProposal}
                          onChange={(e) => {
                            const val = e.target.value;
                            setProjects(prev => prev.map(p => {
                              if (p.id === currentProjectId) {
                                return { ...p, featureProposal: val };
                              }
                              return p;
                            }));
                          }}
                        />
                        <button 
                          className="btn-simulator-submit" 
                          onClick={handleRunSimulation}
                          disabled={!currentProject.featureProposal.trim()}
                          data-od-id="btn-run-simulation"
                        >
                          <Icons.Play />
                          <span>シミュレーション実行</span>
                        </button>
                      </div>
                    </section>

                    {/* Persona Grid list */}
                    <section className="personas-list-section" data-od-id="personas-grid-container">
                      <h2 className="dashboard-section-title">
                        <span>👥 仮想ペルソナモデル一覧</span>
                      </h2>

                      <div className="personas-grid-row">
                        {currentProject.personas.map(persona => {
                          const hasFeedback = currentProject.simulatedFeatureName;
                          return (
                            <div 
                              key={persona.id}
                              className={`persona-box-card ${currentProject.selectedPersonaId === persona.id ? 'active' : ''}`}
                              onClick={() => selectPersona(persona.id)}
                              data-od-id={`persona-card-${persona.id}`}
                            >
                              <div className="persona-card-profile-row">
                                <div className="persona-card-avatar">{persona.avatar}</div>
                                <div className="persona-card-meta">
                                  <h3 className="persona-card-name">{persona.name}</h3>
                                  <span className="persona-card-role">{persona.role}</span>
                                </div>
                              </div>

                              <div className="persona-card-divider"></div>

                              {hasFeedback ? (
                                <>
                                  <div className={`persona-card-sentiment-badge ${persona.sentiment}`}>
                                    <span>
                                      {persona.sentiment === 'happy' && '😊 喜ぶ・推進'}
                                      {persona.sentiment === 'troubled' && '😐 困惑・懸念'}
                                      {persona.sentiment === 'angry' && '🚨 拒絶・抵抗'}
                                    </span>
                                  </div>
                                  <p className="persona-card-feedback-text">
                                    {persona.feedback}
                                  </p>
                                </>
                              ) : (
                                <p className="persona-card-feedback-text" style={{ color: 'var(--muted)', fontStyle: 'italic' }}>
                                  機能要件をシミュレーターに入力して検証してください。
                                </p>
                              )}

                              <span className="card-footer-tip">詳細を見る ➔</span>
                            </div>
                          );
                        })}
                      </div>
                    </section>
                  </main>

                  {/* Right Panel: Selected Persona Inspector (Only rendered when selectedPersonaId is not null) */}
                  {activePersona && (
                    <aside className="dashboard-inspector-right" data-od-id="dashboard-inspector-panel">
                      
                      {/* Tab switching navigation */}
                      <nav className="inspector-tabs-header">
                        <button 
                          className={`inspector-tab-btn ${rightTab === 'profile' ? 'active' : ''}`}
                          onClick={() => setRightTab('profile')}
                          data-od-id="btn-tab-profile"
                        >
                          基本情報
                        </button>
                        <button 
                          className={`inspector-tab-btn ${rightTab === 'activity' ? 'active' : ''}`}
                          onClick={() => setRightTab('activity')}
                          data-od-id="btn-tab-activity"
                        >
                          業務フロー {currentProject.activityDiagramUpdated && '✨'}
                        </button>
                        <button 
                          className={`inspector-tab-btn ${rightTab === 'chat' ? 'active' : ''}`}
                          onClick={() => setRightTab('chat')}
                          data-od-id="btn-tab-chat"
                        >
                          会話を召喚
                        </button>
                        
                        {/* Close button */}
                        <button 
                          className="btn-close-inspector" 
                          onClick={closeInspector} 
                          title="詳細パネルを閉じる"
                          data-od-id="btn-close-inspector"
                        >
                          ✕
                        </button>
                      </nav>

                      {/* Tab contents wrapper */}
                      <div className="inspector-tab-content-box">
                        
                        {/* 1. Profile information */}
                        {rightTab === 'profile' && (
                          <div data-od-id="panel-profile-content">
                            <div className="profile-summary-header">
                              <div className="profile-summary-avatar">{activePersona.avatar}</div>
                              <div>
                                <h3 className="profile-summary-name">{activePersona.name}</h3>
                                <p className="profile-summary-role">{activePersona.role}</p>
                              </div>
                            </div>

                            <div className="profile-bio-box">
                              {activePersona.bio}
                            </div>

                            <div className="profile-stats-section">
                              <div className="profile-stat-bar-item">
                                <div className="profile-stat-bar-label">
                                  <span>ITツール習熟度</span>
                                  <span>{activePersona.stats.literacy}%</span>
                                </div>
                                <div className="profile-stat-bar-track">
                                  <div className="profile-stat-bar-fill" style={{ width: `${activePersona.stats.literacy}%` }}></div>
                                </div>
                              </div>
                              <div className="profile-stat-bar-item">
                                <div className="profile-stat-bar-label">
                                  <span>現場業務負荷</span>
                                  <span>{activePersona.stats.workload}%</span>
                                </div>
                                <div className="profile-stat-bar-track">
                                  <div className="profile-stat-bar-fill" style={{ width: `${activePersona.stats.workload}%` }}></div>
                                </div>
                              </div>
                              <div className="profile-stat-bar-item">
                                <div className="profile-stat-bar-label">
                                  <span>受容プロセス弾力</span>
                                  <span>{activePersona.stats.adaptability}%</span>
                                </div>
                                <div className="profile-stat-bar-track">
                                  <div className="profile-stat-bar-fill" style={{ width: `${activePersona.stats.adaptability}%` }}></div>
                                </div>
                              </div>
                            </div>

                            <span className="sidebar-section-title">新機能への評価詳細</span>
                            <div className="profile-feedback-box">
                              {activePersona.detailedFeedback}
                            </div>
                          </div>
                        )}

                        {/* 2. Activity Workflow Timeline */}
                        {rightTab === 'activity' && (
                          <div className="timeline-steps-list" data-od-id="panel-activity-content">
                            {activePersona.activitySteps.map((step, idx) => (
                              <div key={idx} className={`timeline-step-item ${step.status === 'resolved' ? 'resolved' : step.status === 'alert' ? 'alert' : ''}`}>
                                <div className="timeline-step-node"></div>
                                <div className="timeline-step-content">
                                  <div className="timeline-step-title-row">
                                    <span>{step.label}</span>
                                    {step.status === 'resolved' && <span className="timeline-step-status-tag resolved">改善済</span>}
                                    {step.status === 'alert' && <span className="timeline-step-status-tag alert">ボトルネック</span>}
                                  </div>
                                  <span className="timeline-step-desc">{step.desc}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}

                        {/* 3. Summon Interview Dialog */}
                        {rightTab === 'chat' && (
                          <div className="summon-chat-area" data-od-id="panel-chat-content">
                            <div className="summon-chat-messages-box">
                              {(currentProject.summonChats[activePersona.id] || [
                                { sender: 'persona', text: '接続要件やスケジュール調整機能について、直接私にヒアリングを行えます。気になる点を聞いてください。' }
                              ]).map((msg, idx) => (
                                <div key={idx} className={`summon-chat-bubble-row ${msg.sender === 'user' ? 'user' : 'persona'}`}>
                                  {msg.sender !== 'user' && (
                                    <div className="summon-chat-avatar-mini">{activePersona.avatar}</div>
                                  )}
                                  <div className="summon-chat-bubble">
                                    {msg.text}
                                  </div>
                                </div>
                              ))}
                              <div ref={summonEndRef} />
                            </div>

                            {currentProject.simulatedFeatureName && (
                              <div className="summon-suggestions-row">
                                <button 
                                  className="summon-suggestion-tag" 
                                  onClick={() => handleSendSummonMsg(null, 'スケジュール自動提案機能について懸念点はある？')}
                                >
                                  <Icons.AlertTriangle /> 懸念を聞く
                                </button>
                                <button 
                                  className="summon-suggestion-tag" 
                                  onClick={() => handleSendSummonMsg(null, 'どう作れば現場で嫌がられずに使われる？')}
                                >
                                  <Icons.Sparkles /> 改善要望を聞く
                                </button>
                              </div>
                            )}

                            <form onSubmit={handleSendSummonMsg} className="summon-chat-input-form">
                              <input 
                                type="text" 
                                className="summon-chat-input-field"
                                placeholder={`${activePersona.name}と対話する...`}
                                value={summonInput}
                                onChange={(e) => setSummonInput(e.target.value)}
                              />
                              <button type="submit" className="btn-send-summon">➔</button>
                            </form>
                          </div>
                        )}

                      </div>

                    </aside>
                  )}
                </div>

              </div>
            )}

          </div>

          {/* Toast Notification Alert */}
          {toast && (
            <div className="toast-popup-new">
              <Icons.Info />
              <span>{toast}</span>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
