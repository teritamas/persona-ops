substitutions:
  _REGION: asia-northeast1
  _STATE_BUCKET: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM

steps:
  - id: terraform-init
    name: hashicorp/terraform:1.15.1
    dir: infra/terraform/environments/stg
    args:
      - init
      - -input=false
      - -backend-config=bucket=${_STATE_BUCKET}

  - id: terraform-validate
    name: hashicorp/terraform:1.15.1
    dir: infra/terraform/environments/stg
    args:
      - validate

  - id: build-private-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/persona-ops/private-api:$COMMIT_SHA"
        docker build --tag "$$image" api
        docker push "$$image"
        printf '%s' "$$image" > /workspace/.private-api-image-uri

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/persona-ops/frontend:$COMMIT_SHA"
        docker build --tag "$$image" frontend
        docker push "$$image"
        printf '%s' "$$image" > /workspace/.frontend-image-uri

  - id: terraform-apply
    name: hashicorp/terraform:1.15.1
    dir: infra/terraform/environments/stg
    entrypoint: sh
    args:
      - -euc
      - |
        terraform apply \
          -auto-approve \
          -input=false \
          -lock-timeout=10m \
          -var="api_container_image=$$(cat /workspace/.private-api-image-uri)" \
          -var="frontend_container_image=$$(cat /workspace/.frontend-image-uri)" \
          -var="project_id=$PROJECT_ID" \
          -var="region=${_REGION}"

timeout: 1200s
